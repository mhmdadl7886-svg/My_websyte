<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي - عبدالرحمن الفاتح</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-img {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #0066cc, #00d2ff);
            color: white;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            box-shadow: 0 5px 15px rgba(0, 102, 204, 0.4);
        }
        h1 {
            color: #2d3748;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #0066cc;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        p {
            color: #4a5568;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .skills {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .skill-tag {
            background: #edf2f7;
            color: #4a5568;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #0066cc, #00d2ff);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 102, 204, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0, 102, 204, 0.4);
        }
        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- دائرة افتراضية للحرف الأول من الاسم -->
        <div class="profile-img">ع</div>
        
        <h1>عبدالرحمن الفاتح عبدالرحمن عثمان</h1>
        <div class="subtitle">مطور وباحث في تقنية المعلومات</div>
        
        <p>مرحباً بك في موقعي الشخصي! تم تصميم هذه الصفحة خصيصاً كجزء من متطلبات المقرر الدراسي، لتعكس أساسيات تطوير الويب وتصميم واجهات المستخدم الحديثة.</p>
        
        <div class="skills">
            <span class="skill-tag">HTML5</span>
            <span class="skill-tag">CSS3</span>
            <span class="skill-tag">Web Design</span>
            <span class="skill-tag">Problem Solving</span>
        </div>

        <a href="#" class="btn" onclick="alert('شكراً لزيارة موقعي!')">تواصل معي</a>

        <footer>
            جميع الحقوق محفوظة &copy; 2026
        </footer>
    </div>

</body>
</html>
